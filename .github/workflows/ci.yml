name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure ffmpeg
        timeout-minutes: 3
        run: command -v ffmpeg || (sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update && sudo apt-get install -y ffmpeg)
      - run: uv venv --python 3.12 && uv pip install -e '.[dev]'
      - run: .venv/bin/ruff check src tests scripts && .venv/bin/pytest
      - run: npm ci --prefix frontend && npm run build --prefix frontend
