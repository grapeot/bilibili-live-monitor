[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bilibili-live-monitor"
version = "0.1.0"
description = "B站多直播间静音实时转写看板"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "playwright>=1.50", "python-dotenv>=1.0", "numpy>=2.0", "brotli>=1.1", "onnxruntime>=1.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.9"]

[project.scripts]
bili-live = "bilibili_live_monitor.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/bilibili_live_monitor"]
